openapi: 3.1.0
info:
  title: Skitrace API
  description: "\n**Skitrace — Beyond the Resume.** Evidence-based candidate intelligence: resume ingestion,\nattributed public-signal\
    \ evidence, deterministic requirement matching and ranking, and\noptional AI briefs / knowledge-graph views.\n\n### Authentication\n\
    Protected routes need `Authorization: Bearer <token>`. Click **Authorize** and paste the token.\n\n* **Native mode** (no\
    \ `CLERK_SECRET_KEY` on the backend): `POST /api/v1/auth/register`, then\n  `POST /api/v1/auth/login` and use `access_token`.\
    \ New accounts start as `pending` until an\n  HR admin approves their membership request (unless their email domain is\
    \ auto-admitted).\n* **Clerk mode** (`CLERK_SECRET_KEY` set): only Clerk session tokens are accepted. Sign in\n  through\
    \ the web UI and copy the bearer token from any `/api/...` request in DevTools.\n  Clerk session tokens are short-lived\
    \ (about a minute), so copy a fresh one if you get 401.\n\n### Roles\n`recruiter` ranks and briefs, `hiring_manager` gets\
    \ masked read-only access, `hr_admin`\ninherits both and manages members, audit logs, deletion and rebuilds.\n\n### Asynchronous\
    \ contexts\nAfter an upload, candidate context builds in the background. Context, JD-match and brief\nroutes answer **202**\
    \ with `Retry-After` while building, **503** when the build failed.\n"
  version: 1.0.0
