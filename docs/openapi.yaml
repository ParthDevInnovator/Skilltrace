tags:
- name: Health
  description: Liveness and runtime record counts. Public.
- name: Authentication
  description: Native email/password accounts, sessions, email verification and OAuth.
- name: Jobs
  description: 'Requisitions: list, search, detail and creation with structured requirements.'
- name: Resume ingestion
  description: Upload a PDF/DOCX/TXT resume (≤ 5 MB) to create or update a candidate.
- name: Candidates
  description: Candidate search, detail, evidence context, resume text and per-job match.
- name: JD matching
  description: Deterministic requirement extraction, ranking and similar-job lookup. No LLM involved.
- name: AI assistance
  description: Chat, interview briefs and questions. Needs `GEMINI_API_KEY` and/or `GROQ_API_KEY`; 503 otherwise.
- name: Knowledge graph
  description: Candidate skill graph. Needs `NEO4J_URI`/`NEO4J_USER`/`NEO4J_PASSWORD`; 503 otherwise.
- name: Administration
  description: 'HR-admin routes: membership approval, workspace domains, audit logs, deletion, rebuild.'
- name: Root
  description: Welcome payload with links.
servers:
- url: http://localhost:8000
  description: Local development backend
