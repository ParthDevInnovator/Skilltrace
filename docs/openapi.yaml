      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        full_name:
          anyOf:
          - type: string
            maxLength: 150
          - type: 'null'
          title: Full Name
        email:
          anyOf:
          - type: string
            maxLength: 254
          - type: 'null'
          title: Email
        headline:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Headline
        location:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Location
      type: object
      required:
      - file
      title: Body_ingest_resume_api_v1_ingest_resume_post
    BriefRequest:
      properties:
        job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Id
        reference_date:
          anyOf:
          - type: string
